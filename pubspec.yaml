name: crowdtrack
description: "A project for tracking crowdfunding projects"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cloud_firestore: ^6.2.0
  dynamic_color: ^1.8.1
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
